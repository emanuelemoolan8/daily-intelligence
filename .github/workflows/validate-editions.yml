name: Validate published editions
on:
  push:
    branches: [main]
    paths:
      - 'editions/**'
      - 'index.html'
      - '.github/workflows/validate-editions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate newspaper archive (no API calls)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('editions')
          manifest = json.loads((base / 'index.json').read_text(encoding='utf-8'))
          assert isinstance(manifest, list), 'Archive must be a list'
          seen = set()
          for entry in manifest:
              assert all(k in entry for k in ('date', 'title', 'file')), 'Incomplete archive entry'
              filename = entry['file']
              assert filename not in seen, 'Duplicate archive file'
              seen.add(filename)
              assert filename.endswith('.json') and '/' not in filename and '..' not in filename, 'Unsafe edition filename'
              edition = json.loads((base / filename).read_text(encoding='utf-8'))
              assert 'translations' in edition, 'Missing bilingual edition'
              for lang in ('en', 'ml'):
                  translation = edition['translations'].get(lang)
                  assert isinstance(translation, dict), f'Missing {lang} translation'
                  sections = translation.get('sections')
                  assert isinstance(sections, list) and len(sections) == 6, f'Expected six {lang} desks'
                  assert all(s.get('heading') and isinstance(s.get('stories'), list) for s in sections), 'Invalid section'
          print(f'Validated {len(manifest)} archive entries; no external services called.')
          PY
