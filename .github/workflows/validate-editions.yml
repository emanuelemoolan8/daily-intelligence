name: Validate Daily Intelligence UI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate edition contract
        run: node --test test/edition-contract.test.mjs
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile UI in Chromium
        run: node test/browser-smoke.mjs
      - name: Check public Pages and speech synthesis calls
        run: node test/live-pages-tts.mjs
  recordings:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/build-audio-scripts.mjs
      - run: python -m pip install 'gTTS==2.5.4'
      - run: python scripts/generate-audio.py
      - name: Validate and commit MP3s
        run: |
          for f in audio/2026-10-25/*.mp3; do ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"; done
          test "$(find audio/2026-10-25 -name '*.mp3' | wc -l)" -eq 6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/2026-10-25
          git diff --cached --quiet || (git commit -m 'Add six recorded MP3 narrations' && git push)
