name: Validate Daily Intelligence UI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate edition contract
        run: node --test test/edition-contract.test.mjs test/publishing.test.mjs
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile UI in Chromium
        run: node test/browser-smoke.mjs
      - name: Check public Pages and speech synthesis calls
        run: node test/live-pages-tts.mjs
