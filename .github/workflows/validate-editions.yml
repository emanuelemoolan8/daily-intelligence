name: Validate Daily Intelligence UI
on:
  pull_request:
  push:
    branches: [main, 'edition/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare dated draft in isolation
        id: candidate
        if: startsWith(github.ref, 'refs/heads/edition/')
        run: |
          date="${GITHUB_REF_NAME#edition/}"
          node scripts/prepare-edition.mjs "$date"
          printf 'date=%s\n' "$date" >> "$GITHUB_OUTPUT"
      - name: Validate edition contract
        run: node --test test/edition-contract.test.mjs test/publishing.test.mjs
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile UI in Chromium
        run: node test/browser-smoke.mjs
      - name: Save validated release files
        if: startsWith(github.ref, 'refs/heads/edition/')
        uses: actions/upload-artifact@v4
        with:
          name: validated-edition
          path: |
            editions/latest.js
            editions/${{ steps.candidate.outputs.date }}.js
          if-no-files-found: error
