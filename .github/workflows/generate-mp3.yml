name: Prepare candidate edition recordings

on:
  push:
    branches: ['edition/*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: startsWith(github.ref, 'refs/heads/edition/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline speech and audio tools
        run: |
          npm install --no-save espeak-ng@1.0.2 playwright@1.56.1 @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          mkdir -p "$RUNNER_TEMP/di-tools"
          ln -s "$PWD/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/di-tools/ffmpeg"
          ln -s "$PWD/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/di-tools/ffprobe"
          echo "$RUNNER_TEMP/di-tools" >> "$GITHUB_PATH"
      - name: Validate candidate
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          node scripts/prepare-edition.mjs "$edition"
          node --test test/edition-contract.test.mjs test/publishing.test.mjs
      - name: Produce and validate all six recordings
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          node scripts/generate-offline-audio.mjs "$edition"
          node scripts/prepare-publication.mjs "$edition"
      - name: Check candidate browser experience
        run: |
          npx playwright install --with-deps chromium
          DI_REQUIRE_RECORDINGS=1 node test/browser-smoke.mjs
      - name: Attach validated recordings to the candidate branch
        run: |
          expected=$(git rev-parse HEAD)
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          edition="${GITHUB_REF_NAME#edition/}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "editions/$edition.js" editions/latest.js "audio/$edition" publication.json
          git diff --cached --quiet || (git commit -m "Complete $edition with validated recordings" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME")
