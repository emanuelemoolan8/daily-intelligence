name: Generate current edition recordings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-audio-scripts.mjs'
      - 'scripts/generate-audio.py'
      - 'scripts/edition.mjs'
      - 'scripts/prepare-publication.mjs'
      - '.github/workflows/generate-mp3.yml'
      - 'editions/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-edition-audio
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate edition and prepare narration
        run: |
          node --test test/edition-contract.test.mjs test/publishing.test.mjs
          node scripts/build-audio-scripts.mjs
      - name: Install speech and verification tools
        run: |
          python -m pip install 'gTTS==2.5.4'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate and verify recordings
        run: |
          python scripts/generate-audio.py
          edition=$(node --input-type=module -e "import {readEdition} from './scripts/edition.mjs'; console.log(readEdition().date)")
          for f in "audio/$edition/"*.mp3; do
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f")
            awk -v duration="$duration" 'BEGIN { exit !(duration > 1) }'
          done
          node scripts/prepare-publication.mjs
      - name: Publish recordings only if edition has not changed
        run: |
          expected=$(git rev-parse HEAD)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected"
          edition=$(node --input-type=module -e "import {readEdition} from './scripts/edition.mjs'; console.log(readEdition().date)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "audio/$edition" publication.json
          git diff --cached --quiet || (git commit -m "Publish $edition recordings and readiness manifest" && git push)
