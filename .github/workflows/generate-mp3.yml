name: Prepare candidate edition recordings

on:
  push:
    branches: ['edition/*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: startsWith(github.ref, 'refs/heads/edition/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          test "$edition" = "$(node --input-type=module -e "import {readEdition} from './scripts/edition.mjs'; console.log(readEdition().date)")"
          node scripts/validate-candidate.mjs "$edition"
          node --test test/edition-contract.test.mjs test/publishing.test.mjs
          node scripts/build-audio-scripts.mjs "$edition"
      - name: Install offline speech and audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg
      - name: Produce and validate all six recordings
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          python3 scripts/generate-offline-audio.py "$edition"
          node scripts/prepare-publication.mjs "$edition"
      - name: Check candidate browser experience
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          DI_REQUIRE_RECORDINGS=1 node test/browser-smoke.mjs
      - name: Attach validated recordings to the candidate branch
        run: |
          expected=$(git rev-parse HEAD)
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          edition="${GITHUB_REF_NAME#edition/}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "audio/$edition" publication.json
          git diff --cached --quiet || (git commit -m "Complete $edition with validated recordings" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME")
