name: Prepare candidate edition recordings

on:
  push:
    branches: ['edition/*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: startsWith(github.ref, 'refs/heads/edition/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          node scripts/prepare-edition.mjs "$edition"
          node --test test/edition-contract.test.mjs test/publishing.test.mjs
      - name: Install offline speech and audio tools
        run: |
          packages=()
          command -v espeak-ng || packages+=(espeak-ng)
          if ! command -v ffmpeg || ! command -v ffprobe; then packages+=(ffmpeg); fi
          if (( ${#packages[@]} )); then
            install_tools() {
              timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y --no-install-recommends "${packages[@]}"
            }
            if ! install_tools; then
              timeout 60 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -qq || true
              install_tools
            fi
          fi
      - name: Produce and validate all six recordings
        run: |
          edition="${GITHUB_REF_NAME#edition/}"
          python3 scripts/generate-offline-audio.py "$edition"
          node scripts/prepare-publication.mjs "$edition"
      - name: Check candidate browser experience
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          DI_REQUIRE_RECORDINGS=1 node test/browser-smoke.mjs
      - name: Attach validated recordings to the candidate branch
        run: |
          expected=$(git rev-parse HEAD)
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          edition="${GITHUB_REF_NAME#edition/}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "editions/$edition.js" editions/latest.js "audio/$edition" publication.json
          git diff --cached --quiet || (git commit -m "Complete $edition with validated recordings" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME")
