name: Generate natural newspaper audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free speech engine
        run: python -m pip install 'edge-tts>=7,<8'
      - name: Generate English and Malayalam MP3
        run: python scripts/generate_neural_audio.py
      - name: Verify MP3 files
        run: |
          for file in audio/2026-10-24-{en,ml}-{short,full}.mp3; do
            test -s "$file"
            file "$file"
          done
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/2026-10-24-{en,ml}-{short,full}.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Replace robotic narration with natural neural voices"
            git push
          fi
